services:
  backend:
    image: '${DOCKER_IMAGE_BACKEND:-vvet-backend}:${TAG:-latest}'
    restart: always
    # All app settings come from here (loaded into the container at start-up).
    env_file:
      - backend/.env
    # The Dockerfile's default command listens on 8080 (for Azure); under Compose use 8000.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      # Same build context as the Azure deploy (docker build ./backend)
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

  frontend:
    image: 'vvet-frontend:${TAG:-latest}'
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = the site calls /api/v1 on its own host; nginx forwards that to the backend.
        VITE_BACKEND_URL: ""
    depends_on:
      - backend
    ports:
      - "8080:80"

